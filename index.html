<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Industry Job Titles</title>
<meta name="description" content="A family tree of software industry job titles, from the 1940s to now.">
<style>
  :root { --bg:#fcfcfb; --fg:#222; --muted:#666; --line:#e2e2df; --accent:#2f6db5; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  body { display:flex; flex-direction:column; }
  header { padding:12px 20px 10px; border-bottom:1px solid var(--line); }
  .top { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 18px; }
  h1 { font-size:20px; margin:0; }
  .top p { margin:0; color:var(--muted); font-size:14px; flex:1 1 320px; }
  nav, .fams { display:flex; gap:6px; flex-wrap:wrap; }
  .fams { margin-top:10px; align-items:center; }
  .fams .label { font-size:12px; color:var(--muted); margin-right:4px; }
  a.btn, button { font:inherit; font-size:13px; color:var(--accent); background:#fff;
    border:1px solid var(--line); border-radius:6px; padding:4px 10px; text-decoration:none; cursor:pointer; }
  a.btn:hover, button:hover { border-color:var(--accent); }
  .fams button { color:#333; display:inline-flex; align-items:center; gap:6px; border-radius:999px; }
  .fams button .dot { width:9px; height:9px; border-radius:50%; background:var(--c); }
  .fams button:hover { border-color:var(--c); }
  .fams button[aria-pressed="true"] { background:var(--c); border-color:var(--c); color:#fff; }
  .fams button[aria-pressed="true"] .dot { background:#fff; }
  #wrap { flex:1; position:relative; overflow:hidden; }
  #chart { width:100%; height:100%; }
  #chart > svg { width:100%; height:100%; display:block; }
  #chart > img { width:100%; }
  #chart .node, #chart .edge, #chart .cluster { transition:opacity .25s; }
  #chart [data-state="dim"] { opacity:0; pointer-events:none; }
  #chart [data-state="half"] { opacity:.4; }
  #chart [data-fam] { cursor:pointer; }
  #chart .node[data-fam] { outline:none; }
  #chart.focusing .node:not([data-near]):not([data-state="dim"]),
  #chart.focusing .edge:not([data-near]):not([data-state="dim"]) { opacity:.18; }
  #chart .node[data-sel] > path { stroke-width:4px; }
  #chart .node:focus-visible > path { stroke-width:3.5px; stroke-dasharray:4 2; }
  #panel { position:absolute; top:0; right:0; bottom:0; width:min(400px, 100%); overflow-y:auto;
    background:#fff; border-left:1px solid var(--line); box-shadow:-6px 0 24px rgba(0,0,0,.08);
    padding:16px 20px 24px; font-size:14px; line-height:1.5; z-index:2; }
  #panel[hidden] { display:none; }
  #panel .close { position:sticky; top:0; float:right; margin:-4px -8px 0 8px; font-size:20px; line-height:1;
    padding:2px 9px; color:var(--muted); }
  #panel .chip { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--c);
    font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  #panel .chip .dot, #panel .rel .dot { width:9px; height:9px; border-radius:50%; background:var(--c); flex:none; }
  #panel h2 { font-size:22px; line-height:1.2; margin:6px 0 2px; }
  #panel .date { color:var(--muted); font-size:13px; margin-bottom:12px; }
  #panel h3 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:18px 0 4px; }
  #panel p { margin:0 0 10px; }
  #panel .rels { margin:6px 0 0; }
  #panel .rels dt { font-size:12px; color:var(--muted); margin-top:10px; }
  #panel .rels dd { margin:4px 0 0; display:flex; flex-wrap:wrap; gap:6px; }
  #panel .rel { color:#333; display:inline-flex; align-items:center; gap:6px; border-radius:999px; font-size:13px; }
  #panel .rel:hover { border-color:var(--c); }
  #panel .note { font-size:12px; color:var(--muted); margin-top:20px; }
  .hint { position:absolute; right:12px; bottom:10px; font-size:12px; color:var(--muted);
    background:rgba(255,255,255,.85); padding:3px 8px; border-radius:4px; pointer-events:none; }
  @media (max-width:600px) {
    header { padding:10px 16px; } .hint { display:none; }
    #panel { top:auto; width:100%; max-height:58%; border-left:0; border-top:1px solid var(--line);
      box-shadow:0 -6px 24px rgba(0,0,0,.1); padding:14px 16px 20px; }
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Software Industry Job Titles</h1>
    <p>A family tree, 1940s to now. Dates are roughly when a title became common, not its first use.</p>
    <nav>
      <button id="fit" type="button">Fit</button>
      <a class="btn" href="job_title_family_tree.svg">SVG</a>
      <a class="btn" href="job_title_family_tree.png">PNG</a>
      <a class="btn" href="job_title_family_tree.dot">Graphviz source</a>
    </nav>
  </div>
  <div class="fams" id="fams"><span class="label">Show:</span></div>
</header>
<div id="wrap">
  <div id="chart" role="img" aria-label="Software industry job title family tree"></div>
  <aside id="panel" hidden aria-live="polite"></aside>
  <div class="hint">Click a title for its story, or a family's band to show just that one · scroll or drag to pan · pinch or ctrl+scroll to zoom · Esc to go back</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
<script>
(function () {
  var FAMS = [
    { id: 'lead', name: 'Analysis, architecture & leadership', c: '#6b4bb0' },
    { id: 'ops',  name: 'Operations & infrastructure',         c: '#2f8a43' },
    { id: 'sup',  name: 'Support & customer-facing',           c: '#5f6b76' },
    { id: 'dev',  name: 'Development',                         c: '#2f6db5' },
    { id: 'data', name: 'Data & AI',                           c: '#9a7600' },
    { id: 'net',  name: 'Networks & security',                 c: '#c4621a' },
    { id: 'qa',   name: 'Quality & test',                      c: '#b23a5e' }
  ];
  var famBar = document.getElementById('fams'), buttons = {};
  function addButton(id, name, colour) {
    var b = document.createElement('button');
    b.type = 'button'; b.style.setProperty('--c', colour);
    b.setAttribute('aria-pressed', 'false');
    b.innerHTML = '<span class="dot"></span>' + name;
    b.addEventListener('click', function () { select(id === 'all' || current === id ? null : id); });
    famBar.appendChild(b); buttons[id] = b;
  }
  addButton('all', 'All', '#444444');
  FAMS.forEach(function (f) { addButton(f.id, f.name, f.c); });

  var chart = document.getElementById('chart'), pz = null, svg = null;
  var nodes = [], edges = [], clusters = {}, nodeFam = {}, current = null;
  var byId = {}, DESC = {}, openId = null, panel = document.getElementById('panel');
  var FAM = {}; FAMS.forEach(function (f) { FAM[f.id] = f; });

  // Descriptions are optional: without them a box still opens, showing its links.
  var descReady = fetch('descriptions.json', { cache: 'no-cache' })
    .then(function (r) { return r.ok ? r.json() : {}; })
    .then(function (d) { DESC = d || {}; }, function () {});

  function famOf(el) { return el.getAttribute('data-fam'); }

  // Family of each band and box. Uses the fam-* classes in the SVG; for an
  // SVG without them, takes the band's family from its "cluster_<fam>" title
  // and a box's family from the band its centre lies in.
  function tagFamilies() {
    var bands = [];
    Array.prototype.forEach.call(svg.querySelectorAll('g.cluster'), function (el) {
      var m = (el.getAttribute('class') || '').match(/fam-([a-z]+)/) ||
              (el.querySelector('title').textContent.match(/^cluster_([a-z]+)$/));
      var fam = m && m[1];
      if (!fam || !FAMS.some(function (f) { return f.id === fam; })) return;
      el.setAttribute('data-fam', fam); clusters[fam] = el;
      bands.push({ fam: fam, r: el.getBoundingClientRect() });
    });
    Array.prototype.forEach.call(svg.querySelectorAll('g.node'), function (el) {
      var id = el.querySelector('title').textContent;
      var m = (el.getAttribute('class') || '').match(/fam-([a-z]+)/), fam = m && m[1];
      if (!fam) {
        var r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        bands.forEach(function (bd) {
          if (cx >= bd.r.left && cx <= bd.r.right && cy >= bd.r.top && cy <= bd.r.bottom) fam = bd.fam;
        });
      }
      if (fam) el.setAttribute('data-fam', fam);
      nodeFam[id] = fam || null;
      // Label lines: the 9pt ones are the date, the rest the title.
      var name = [], date = [];
      Array.prototype.forEach.call(el.querySelectorAll('text'), function (t) {
        (parseFloat(t.getAttribute('font-size')) < 10 ? date : name).push(t.textContent.trim());
      });
      var n = { id: id, el: el, name: name.join(' ').replace(/\s+/g, ' '), date: date.join(' ') };
      nodes.push(n);
      if (fam) {
        byId[id] = n;
        el.setAttribute('tabindex', '0'); el.setAttribute('role', 'button');
        el.setAttribute('aria-label', n.name + ', ' + n.date);
      }
    });
    Array.prototype.forEach.call(svg.querySelectorAll('g.edge'), function (el) {
      var t = el.querySelector('title').textContent.split('->');
      var path = el.querySelector('path');
      edges.push({ a: t[0], b: t[1], el: el, timeline: /^t\d{4}$/.test(t[0]),
                   dashed: !!(path && path.getAttribute('stroke-dasharray')),
                   both: el.querySelectorAll('polygon').length > 1 });
    });
  }

  function fitAll() { if (pz) { pz.resize(); pz.fit(); pz.center(); } }

  // Fill the screen's width with the family's column, starting at its top,
  // but no bigger than the chart's natural size (12pt text ~ 13px); scroll
  // to move down it. Computed from coordinates, because svg-pan-zoom applies
  // changes on the next animation frame.
  function zoomTo(el) {
    pz.resize();
    var vp = svg.querySelector('.svg-pan-zoom_viewport') || svg;
    var m = vp.getCTM().inverse().multiply(el.getCTM()), b = el.getBBox();
    var x0 = m.a * b.x + m.e, y0 = m.d * b.y + m.f, w = m.a * b.width, h = m.d * b.height;
    var sz = pz.getSizes(), W = sz.width, H = sz.height;
    var z = Math.min(W * 0.92 / w, 1.1);
    pz.zoom(z / (sz.realZoom / pz.getZoom()));
    pz.pan({ x: W / 2 - (x0 + w / 2) * z,
             y: h * z < H ? H / 2 - (y0 + h / 2) * z : 12 - y0 * z });
  }

  function select(fam) {
    current = fam;
    Object.keys(buttons).forEach(function (k) {
      buttons[k].setAttribute('aria-pressed', String((fam || 'all') === k));
    });
    try { history.replaceState(null, '', fam ? '#' + fam : location.pathname); } catch (e) {}
    if (!svg) return;
    var near = {};
    edges.forEach(function (e) {
      var inA = nodeFam[e.a] === fam, inB = nodeFam[e.b] === fam;
      var state = !fam || e.timeline || (inA && inB) ? '' : (inA || inB ? 'half' : 'dim');
      if (fam && (inA || inB)) { near[e.a] = 1; near[e.b] = 1; }
      e.el.setAttribute('data-state', state);
    });
    nodes.forEach(function (n) {
      var state = !fam || !nodeFam[n.id] || nodeFam[n.id] === fam ? '' : (near[n.id] ? 'half' : 'dim');
      n.el.setAttribute('data-state', state);
    });
    Object.keys(clusters).forEach(function (k) {
      clusters[k].setAttribute('data-state', !fam || k === fam ? '' : 'dim');
    });
    if (fam && clusters[fam]) zoomTo(clusters[fam]); else fitAll();
    if (openId) focus(openId);
  }

  // ------------------------------------------------------------ title panel
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  }

  function relations(id) {
    var r = { from: [], to: [], infBy: [], inf: [], both: [] };
    edges.forEach(function (e) {
      if (e.timeline || (e.a !== id && e.b !== id)) return;
      var other = e.a === id ? e.b : e.a;
      if (!byId[other]) return;
      if (e.both) r.both.push(other);
      else if (e.b === id) (e.dashed ? r.infBy : r.from).push(other);
      else (e.dashed ? r.inf : r.to).push(other);
    });
    return r;
  }

  // Highlight a box, its neighbours and the arrows between them.
  function focus(id) {
    nodes.forEach(function (n) { n.el.removeAttribute('data-near'); n.el.removeAttribute('data-sel'); });
    edges.forEach(function (e) { e.el.removeAttribute('data-near'); });
    if (!id) { chart.classList.remove('focusing'); return; }
    chart.classList.add('focusing');
    byId[id].el.setAttribute('data-near', ''); byId[id].el.setAttribute('data-sel', '');
    edges.forEach(function (e) {
      if (e.timeline || (e.a !== id && e.b !== id)) return;
      e.el.setAttribute('data-near', '');
      var o = byId[e.a === id ? e.b : e.a]; if (o) o.el.setAttribute('data-near', '');
    });
  }

  function relButtons(ids) {
    return ids.map(function (o) {
      var n = byId[o], f = FAM[nodeFam[o]];
      return '<button type="button" class="rel" data-go="' + esc(o) + '" style="--c:' + f.c + '">' +
             '<span class="dot"></span>' + esc(n.name) + '</button>';
    }).join('');
  }

  function openNode(id, centre) {
    var n = byId[id]; if (!n) return;
    // A title hidden by the family filter: show everything first.
    if (current && n.el.getAttribute('data-state') === 'dim') select(null);
    openId = id;
    var d = DESC[id] || {}, f = FAM[nodeFam[id]], r = relations(id);
    var groups = [['Grew out of', r.from], ['Led to', r.to], ['Overlaps with (both ways)', r.both],
                  ['Influenced by / people came from', r.infBy], ['Influenced / people moved on to', r.inf]];
    panel.innerHTML =
      '<button type="button" class="close" aria-label="Close">×</button>' +
      '<div class="chip" style="--c:' + f.c + '"><span class="dot"></span>' + esc(f.name) + '</div>' +
      '<h2>' + esc(n.name) + '</h2><div class="date">' + esc(n.date) + '</div>' +
      (d.about ? '<h3>History &amp; background</h3><p>' + esc(d.about) + '</p>' : '') +
      (d.links ? '<h3>Connections</h3><p>' + esc(d.links) + '</p>' : '') +
      '<dl class="rels">' + groups.filter(function (g) { return g[1].length; }).map(function (g) {
        return '<dt>' + g[0] + '</dt><dd>' + relButtons(g[1]) + '</dd>';
      }).join('') + '</dl>' +
      '<p class="note">Best-effort summary, not a sourced citation. ' +
      '<a href="https://github.com/ianmiell/sw-job-title-family-tree">Corrections welcome</a>.</p>';
    panel.hidden = false; panel.scrollTop = 0;
    focus(id);
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
    if (centre) centreOn(n.el); else keepVisible(n.el);
  }

  function closePanel() {
    if (!openId) return;
    var el = byId[openId].el;
    openId = null; panel.hidden = true; focus(null);
    try { history.replaceState(null, '', current ? '#' + current : location.pathname); } catch (e) {}
    if (document.activeElement && panel.contains(document.activeElement)) el.focus();
  }

  // The part of the chart not covered by the panel, in chart-relative pixels.
  function freeArea() {
    var c = chart.getBoundingClientRect(), W = c.width, H = c.height;
    if (panel.hidden) return { x: 0, y: 0, w: W, h: H };
    var p = panel.getBoundingClientRect();
    return p.top > c.top + 1 ? { x: 0, y: 0, w: W, h: p.top - c.top }
                             : { x: 0, y: 0, w: p.left - c.left, h: H };
  }

  // Pan (zooming in if the chart is small) so the box sits in the middle of the free area.
  function centreOn(el) {
    pz.resize();
    var vp = svg.querySelector('.svg-pan-zoom_viewport') || svg;
    var m = vp.getCTM().inverse().multiply(el.getCTM()), b = el.getBBox();
    var cx = m.a * (b.x + b.width / 2) + m.e, cy = m.d * (b.y + b.height / 2) + m.f;
    var sz = pz.getSizes(), z = Math.max(sz.realZoom, 1), a = freeArea();
    if (z !== sz.realZoom) pz.zoom(z / (sz.realZoom / pz.getZoom()));
    pz.pan({ x: a.x + a.w / 2 - cx * z, y: a.y + a.h / 2 - cy * z });
  }

  // Pan just enough that a clicked box is not under the panel.
  function keepVisible(el) {
    var c = chart.getBoundingClientRect(), r = el.getBoundingClientRect(), a = freeArea(), pad = 24;
    var dx = Math.min(0, c.left + a.x + a.w - pad - r.right), dy = Math.min(0, c.top + a.y + a.h - pad - r.bottom);
    if (dx || dy) pz.panBy({ x: dx, y: dy });
  }

  panel.addEventListener('click', function (ev) {
    var go = ev.target.closest('[data-go]');
    if (go) { openNode(go.getAttribute('data-go'), true); return; }
    if (ev.target.closest('.close')) closePanel();
  });

  function init() {
    tagFamilies();
    svg.removeAttribute('width'); svg.removeAttribute('height');
    pz = svgPanZoom(svg, { zoomScaleSensitivity: 0.3, minZoom: 0.5, maxZoom: 15,
                           fit: true, center: true, dblClickZoomEnabled: false,
                           mouseWheelZoomEnabled: false });

    // Scroll (wheel or two-finger trackpad) pans; pinch or ctrl+scroll zooms.
    svg.addEventListener('wheel', function (ev) {
      ev.preventDefault();
      var k = ev.deltaMode === 1 ? 16 : 1;
      if (ev.ctrlKey) {
        var box = svg.getBoundingClientRect();
        pz.zoomAtPointBy(Math.exp(-ev.deltaY * k * 0.01),
                         { x: ev.clientX - box.left, y: ev.clientY - box.top });
      } else {
        pz.panBy({ x: -ev.deltaX * k, y: -ev.deltaY * k });
      }
    }, { passive: false });

    // A click on a family's band or box selects it; a drag (pan) does not.
    var down = null;
    svg.addEventListener('mousedown', function (ev) { down = { x: ev.clientX, y: ev.clientY }; });
    svg.addEventListener('click', function (ev) {
      if (down && Math.abs(ev.clientX - down.x) + Math.abs(ev.clientY - down.y) > 5) return;
      var box = ev.target.closest('g.node');
      if (box && byId[box.querySelector('title').textContent]) {
        openNode(box.querySelector('title').textContent);
        return;
      }
      var g = ev.target.closest('[data-fam]');
      var fam = g && famOf(g);
      if (fam && fam !== current) select(fam);
      else if (!g) closePanel();
    });
    svg.addEventListener('keydown', function (ev) {
      var box = ev.target.closest && ev.target.closest('g.node');
      if (box && (ev.key === 'Enter' || ev.key === ' ')) {
        ev.preventDefault(); openNode(box.querySelector('title').textContent, true);
      }
    });

    window.addEventListener('resize', function () {
      if (current && clusters[current]) zoomTo(clusters[current]); else fitAll();
    });
    var h = location.hash.slice(1);
    select(clusters[h] ? h : null);
    if (byId[h]) descReady.then(function () { openNode(h, true); });
  }

  // Fetched (not <object>/<img>) so the browser revalidates it every time and
  // never pairs this page with a stale cached chart.
  fetch('job_title_family_tree.svg', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (text) {
      chart.innerHTML = text.replace(/^[\s\S]*?(<svg)/, '$1');
      svg = chart.querySelector('svg');
      if (!svg || !window.svgPanZoom) throw new Error('no svg');
      init();
    })
    .catch(function () {
      chart.innerHTML = '<img src="job_title_family_tree.png" alt="Software industry job title family tree">';
    });

  document.getElementById('fit').addEventListener('click', function () {
    if (current && clusters[current]) zoomTo(clusters[current]); else fitAll();
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { if (openId) closePanel(); else select(null); }
  });
})();
</script>
</body>
</html>
