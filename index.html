<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Industry Job Titles</title>
<meta name="description" content="A family tree of software industry job titles, from the 1940s to now.">
<style>
  :root { --bg:#fcfcfb; --fg:#222; --muted:#666; --line:#e2e2df; --accent:#2f6db5; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  body { display:flex; flex-direction:column; }
  header { padding:14px 20px 10px; border-bottom:1px solid var(--line);
    display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 18px; }
  h1 { font-size:20px; margin:0; }
  header p { margin:0; color:var(--muted); font-size:14px; flex:1 1 320px; }
  nav { display:flex; gap:8px; flex-wrap:wrap; }
  nav a, nav button { font:inherit; font-size:13px; color:var(--accent); background:#fff;
    border:1px solid var(--line); border-radius:6px; padding:4px 10px; text-decoration:none; cursor:pointer; }
  nav a:hover, nav button:hover { border-color:var(--accent); }
  #wrap { flex:1; position:relative; overflow:hidden; }
  #chart { width:100%; height:100%; display:block; }
  .hint { position:absolute; right:12px; bottom:10px; font-size:12px; color:var(--muted);
    background:rgba(255,255,255,.85); padding:3px 8px; border-radius:4px; pointer-events:none; }
  @media (max-width:600px) { header { padding:10px 16px; } }
</style>
</head>
<body>
<header>
  <h1>Software Industry Job Titles</h1>
  <p>A family tree, 1940s to now. Dates are roughly when a title became common, not its first use.</p>
  <nav>
    <button id="fit" type="button">Fit</button>
    <a href="job_title_family_tree.svg">SVG</a>
    <a href="job_title_family_tree.png">PNG</a>
    <a href="job_title_family_tree.dot">Graphviz source</a>
  </nav>
</header>
<div id="wrap">
  <object id="chart" type="image/svg+xml" data="job_title_family_tree.svg">
    <img src="job_title_family_tree.png" alt="Software industry job title family tree" style="width:100%">
  </object>
  <div class="hint">Scroll or pinch to zoom, drag to pan</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
<script>
  var obj = document.getElementById('chart'), pz = null;
  obj.addEventListener('load', function () {
    var svg = obj.contentDocument && obj.contentDocument.querySelector('svg');
    if (!svg || !window.svgPanZoom) return;
    svg.setAttribute('width', '100%'); svg.setAttribute('height', '100%');
    pz = svgPanZoom(svg, { zoomScaleSensitivity: 0.3, minZoom: 0.5, maxZoom: 12,
                           fit: true, center: true, dblClickZoomEnabled: true });
    window.addEventListener('resize', function () { pz.resize(); pz.fit(); pz.center(); });
  });
  document.getElementById('fit').addEventListener('click', function () {
    if (pz) { pz.resize(); pz.fit(); pz.center(); }
  });
</script>
</body>
</html>
